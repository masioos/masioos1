# Production stack on the customer's own server: the app + Postgres.
# Run: docker compose -f compose.prod.yaml up -d --build
# Set POSTGRES_PASSWORD in a .env file on the server. Never commit it.
# Migrations: run `pnpm db:migrate` with DATABASE_URL pointing at this DB before starting a new version.
services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://anbarnet:${POSTGRES_PASSWORD}@db:5432/anbarnet
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: anbarnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: anbarnet
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "anbarnet"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  db-data:
